# Serwer laboratoryjny (VM 10.10.10.30)
services:
  webapp:
    build: ./webapp
    ports:
      - "5000:5000"     # HTTP, celowo bez TLS, aby ruch był widoczny dla IDS
    restart: unless-stopped

  modern-tls:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-modern/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "443:443"
    restart: unless-stopped

  legacy-tls:
    build: ./legacy-tls
    volumes:
      - ./certs:/certs:ro
    ports:
      - "4433:4433"
    restart: unless-stopped
