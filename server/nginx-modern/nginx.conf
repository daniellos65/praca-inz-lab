# Nowoczesny serwer TLS - punkt odniesienia (tylko TLS 1.2/1.3 i szyfry AEAD)
events {}
http {
    server {
        listen 443 ssl;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        location / {
            default_type text/plain;
            return 200 "Nowoczesny serwer TLS: $ssl_protocol $ssl_cipher\n";
        }
    }
}
